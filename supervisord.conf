[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:auth-service]
command=uvicorn auth_service.main:app --host 0.0.0.0 --port 8001
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/auth-service.err.log
stdout_logfile=/var/log/auth-service.out.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",PYTHONPATH="/app"

[program:doctor-service]
command=uvicorn doctor_service.main:app --host 0.0.0.0 --port 8003
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/doctor-service.err.log
stdout_logfile=/var/log/doctor-service.out.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",PYTHONPATH="/app"

[program:appointment-service]
command=uvicorn appointment_service.main:app --host 0.0.0.0 --port 8004
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/appointment-service.err.log
stdout_logfile=/var/log/appointment-service.out.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",PYTHONPATH="/app"

[program:user-service]
command=uvicorn user_service.main:app --host 0.0.0.0 --port 8002
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/user-service.err.log
stdout_logfile=/var/log/user-service.out.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",PYTHONPATH="/app"

[program:notification-service]
command=uvicorn notification_service.main:app --host 0.0.0.0 --port 8005
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/notification-service.err.log
stdout_logfile=/var/log/notification-service.out.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",PYTHONPATH="/app"

[program:frontend]
command=npm run preview --prefix /app/frontend -- --port 5173 --host 0.0.0.0
directory=/app/frontend
autostart=true
autorestart=true
stderr_logfile=/var/log/frontend.err.log
stdout_logfile=/var/log/frontend.out.log
environment=VITE_API_URL="%(ENV_VITE_API_URL)s"
