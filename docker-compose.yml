services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
    volumes:
      - ./backend/services/auth-service/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  doctor-service:
    build:
      context: ./backend/services/doctor-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  appointment-service:
    build:
      context: ./backend/services/appointment-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
      - AUTH_SERVICE_URL=http://auth-service:8001
      - DOCTOR_SERVICE_URL=http://doctor-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      doctor-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  api-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - doctor-service
      - appointment-service
      - notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
